<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View photographs of Lesotho's mountains, waterfalls, wildlife, and culture.">
    <title>Gallery | Visit Lesotho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="Home.html">🏔️ Visit Lesotho</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" aria-controls="mainNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="About.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="Destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="Gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contacts.html">Contact / Booking</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="gallery-hero text-white text-center py-5">
        <div class="container py-5">
            <h1 class="display-4 fw-bold">Lesotho Photo Gallery</h1>
            <p class="lead">A glimpse of the Kingdom in the Sky.</p>
        </div>
    </section>
</header>

<main class="container py-5">
    <section aria-labelledby="gallery-heading">
        <div class="text-center mb-5">
            <h2 id="gallery-heading" class="fw-bold">Explore the Scenery</h2>
            <p class="text-muted">Select a photograph to view it larger.</p>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="galleryGrid">
            <div class="col">
                <button class="gallery-item" type="button"
                        data-image="Maletsunyane fall.jpg"
                        data-caption="Maletsunyane Waterfall">
                    <img src="Maletsunyane fall.jpg" alt="Maletsunyane Waterfall near Semonkong">
                    <span>Maletsunyane Waterfall</span>
                </button>
            </div>

            <div class="col">
                <button class="gallery-item" type="button"
                        data-image="AZCV0036.WEBP"
                        data-caption="Maloti Mountains">
                    <img src="MALOTI.webp" alt="Mountain landscape in the Maloti range" >
                    <span>Maloti Mountains</span>
                </button>
            </div>

            <div class="col">
                <button class="gallery-item" type="button"
                        data-image="tshehlanyane.jfif"
                        data-caption="Tšehlanyane Nature Reserve">
                    <img src="tshehlanyane.jfif" alt="Landscape in Tšehlanyane Nature Reserve">
                    <span>Tšehlanyane Nature Reserve</span>
                </button>
            </div>

            <div class="col">
                <button class="gallery-item" type="button"
                        data-image="IMG_6629.JPG"
                        data-caption="Basotho Pony Trekking">
                    <img src="IMG_6629.JPG" alt="Basotho pony trekking in the highlands">
                    <span>Basotho Pony Trekking</span>
                </button>
            </div>

            <div class="col">
                <button class="gallery-item" type="button"
                        data-image="CVHI1272.WEBP"
                        data-caption="Basotho Village">
                    <img src="CVHI1272.WEBP" alt="Traditional village in Lesotho">
                    <span>Basotho Village</span>
                </button>
            </div>

            <div class="col">
                <button class="gallery-item" type="button"
                        data-image="COKD8481.WEBP"
                        data-caption="Lesotho Highlands">
                    <img src="COKD8481.WEBP" alt="Highland scenery in Lesotho" ">
                    <span>Lesotho Highlands</span>
                </button>
            </div>
        </div>
    </section>
</main>

<footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">&copy; 2026 EXPLORE LESOTHO WITH MALESHOANE</p>
    <a href="Contacts.html" class="text-white">Contact / Booking</a>
</footer>

<!-- Image preview modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header border-0">
                <h2 class="modal-title fs-5" id="imageModalLabel">Gallery image</h2>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <img id="modalImage" class="img-fluid rounded" src="" alt="">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const imageModal = new bootstrap.Modal(document.getElementById("imageModal"));
    const modalImage = document.getElementById("modalImage");
    const modalTitle = document.getElementById("imageModalLabel");

    document.querySelectorAll(".gallery-item").forEach((item) => {
        item.addEventListener("click", () => {
            const imagePath = item.dataset.image;
            const caption = item.dataset.caption;

            modalImage.src = imagePath;
            modalImage.alt = caption;
            modalTitle.textContent = caption;
            imageModal.show();
        });
    });
</script>

</body>
</html>
