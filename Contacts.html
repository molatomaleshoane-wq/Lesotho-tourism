<div class="container">
    <h2>Lesotho Tourism</h2>

    
    <h3>Book Your Trip / Register </h3>
    
    <form>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address </label>
            <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number </label>
            <input type="tel" id="phone" required>
        </div>
        
        <div class="form-group">
            <label for="password">Create Password </label>
            <input type="password" id="password" required>
        </div>

        <div class="section-title">Assignment Requirements</div>
        
        <div class="form-group">
            <label for="institution">Institution / School</label>
            <input type="text" id="institution" placeholder="e.g: NUL, Lerotholi, ">
        </div>

        <div class="form-group">
            <label for="topic">purpose of Visit </label>
            <input type="text" id="topic" placeholder="Mohlala: Geography, Culture Research">
        </div>

        <div class="form-group">
            <label for="submission-date">Submission / Target Date</label>
            <input type="date" id="submission-date">
        </div>

        <div class="form-group">
            <label for="requirements">Special Requirements / Guidance Needed </label>
            <textarea id="requirements" rows="4" placeholder=" needs."></textarea>
        </div>
        
        <button type="submit" class="btn">Submit Booking</button>
    </form>
</div>

</body>
</html>
